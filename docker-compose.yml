services:
  # ── Infrastructure ──────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: sports-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: sports-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data

  postgres:
    image: postgres:15-alpine
    hostname: postgres
    container_name: sports-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: sportspred
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: sports-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.0
    hostname: mlflow
    container_name: sports-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns

  # ── Application Services ────────────────────────────────

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    hostname: ingestion
    container_name: sports-ingestion
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/sportspred
      DATABASE_URL_SYNC: postgresql://user:pass@postgres:5432/sportspred
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started

  nlp-service:
    build:
      context: .
      dockerfile: services/nlp_service/Dockerfile
    hostname: nlp-service
    container_name: sports-nlp-service
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/sportspred
      DATABASE_URL_SYNC: postgresql://user:pass@postgres:5432/sportspred
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started

  biometric-service:
    build:
      context: .
      dockerfile: services/biometric_service/Dockerfile
    hostname: biometric-service
    container_name: sports-biometric-service
    ports:
      - "8003:8003"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/sportspred
      DATABASE_URL_SYNC: postgresql://user:pass@postgres:5432/sportspred
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started

  model-serving:
    build:
      context: .
      dockerfile: services/model_serving/Dockerfile
    hostname: model-serving
    container_name: sports-model-serving
    ports:
      - "8004:8004"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/sportspred
      DATABASE_URL_SYNC: postgresql://user:pass@postgres:5432/sportspred
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      mlflow:
        condition: service_started
    volumes:
      - ./models:/app/models

  reporting-service:
    build:
      context: .
      dockerfile: services/reporting_service/Dockerfile
    hostname: reporting-service
    container_name: sports-reporting-service
    ports:
      - "8005:8005"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/sportspred
      DATABASE_URL_SYNC: postgresql://user:pass@postgres:5432/sportspred
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started

  feature-engine:
    build:
      context: .
      dockerfile: services/feature_engine/Dockerfile
    hostname: feature-engine
    container_name: sports-feature-engine
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/sportspred
      DATABASE_URL_SYNC: postgresql://user:pass@postgres:5432/sportspred
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started
    profiles:
      - feature-engine
    restart: "no"

  model-training:
    build:
      context: .
      dockerfile: services/model_training/Dockerfile
    hostname: model-training
    container_name: sports-model-training
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/sportspred
      DATABASE_URL_SYNC: postgresql://user:pass@postgres:5432/sportspred
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_started
      mlflow:
        condition: service_started
    volumes:
      - ./models:/app/models
    profiles:
      - training
    restart: "no"

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  postgres_data:
  redis_data:
  mlflow_data:
