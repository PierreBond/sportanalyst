services:
  postgres:
    image: postgres:15-alpine
    container_name: sports-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: sportspred
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sports-backend
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/sportspred
      DATABASE_URL_SYNC: postgresql://user:pass@postgres:5432/sportspred
      API_KEY: ${API_KEY:-yhYFZIBxoz7cY2vrBVwh3SnWZgqaSy/cLDt4ElHeeoM=}
      MODEL_PATH: /app/models/predictor.joblib
      MODEL_METADATA_PATH: /app/models/predictor_metadata.json
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8005
    container_name: sports-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8005
      BACKEND_INTERNAL_URL: http://backend:8005
      BACKEND_API_KEY: ${API_KEY:-yhYFZIBxoz7cY2vrBVwh3SnWZgqaSy/cLDt4ElHeeoM=}
    depends_on:
      - backend
    restart: unless-stopped

  # daily odds pull + prediction refresh; scheduler lives in-container
  # (no host Task Scheduler, GitHub runners can't reach postgres:5432)
  odds-refresh:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sports-odds-refresh
    environment:
      # DATABASE_URL satisfies sports_common.Settings import (sync scripts use _SYNC)
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/sportspred
      DATABASE_URL_SYNC: postgresql://user:pass@postgres:5432/sportspred
      ODDS_API_KEY: ${ODDS_API_KEY}
      REFRESH_DELAY: "21600"     # initial stagger: 6h
      REFRESH_INTERVAL: "86400"  # then every 24h
    command: >
      sh -c "sleep $$REFRESH_DELAY;
             while true; do
               python scripts/pull_odds.py || true;
               python scripts/batch_predict.py || true;
               sleep $$REFRESH_INTERVAL;
             done"
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
