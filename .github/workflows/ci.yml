name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint Python
        run: |
          pip install ruff==0.8.6
          ruff check libs/ services/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - "5432:5432"
      redis:
        image: redis:7
        ports:
          - "6379:6379"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system pytest pytest-cov pytest-asyncio httpx numpy pandas pyyaml redis scikit-learn fastapi structlog sqlalchemy asyncpg pydantic pydantic-settings kafka-python xgboost shap joblib
          cd libs && uv pip install --system -e ".[dev]" && cd ..

      - name: Run backend tests
        run: pytest libs/tests/ services/biometric_service/tests/ services/feature_engine/tests/ services/model_training/tests/ services/nlp_service/tests/ services/model_serving/tests/ -v --cov=sports_common --cov-report=xml:coverage.xml
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          API_KEY: ci-api-key
          PYTHONPATH: .

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mypy
        run: pip install mypy types-requests

      - name: Type check
        run: mypy libs/sports_common --ignore-missing-imports

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: pip install bandit detect-secrets

      - name: Run Bandit security scan
        run: bandit -r libs/ services/ -f json -o bandit-report.json --severity-level medium || true

      - name: Check for secrets
        run: |
          detect-secrets scan --all-files > secrets-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          def norm(p):
              return p.replace("\\", "/")

          report = json.loads(Path("secrets-report.json").read_text())
          baseline = json.loads(Path(".secrets.baseline").read_text())
          results = report.get("results", {})
          baseline_map = {norm(k): v for k, v in baseline.get("results", {}).items()}
          new_secrets = {}
          for fname, findings in results.items():
              bh = {f["hashed_secret"] for f in baseline_map.get(norm(fname), [])}
              new = [f for f in findings if f["hashed_secret"] not in bh]
              if new:
                  new_secrets[fname] = new
          if new_secrets:
              leaked = sum(len(v) for v in new_secrets.values())
              raise SystemExit(f"detect-secrets found {leaked} NEW secrets (not in baseline)")
          PY

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            secrets-report.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  data-leakage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv pytest pandas numpy
          cd libs && uv pip install --system -e ".[dev]" && cd ..

      - name: Run data leakage tests
        run: PYTHONPATH=. pytest services/feature_engine/tests/test_data_leakage.py -v
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/test

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system numpy pandas scikit-learn xgboost joblib pydantic pydantic-settings structlog pyyaml
          cd libs && uv pip install --system -e . && cd ..

      - name: Run benchmark script
        run: PYTHONPATH=. python scripts/benchmark_classical_vs_deep.py
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          DATABASE_URL_SYNC: postgresql://test:test@localhost:5432/test

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: model-benchmark-report
          path: reports/model_benchmark_*.md
